<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Dasar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <div class="header-inner">
          <span class="logo">SalsNote</span>
          <button
            class="dark-mode-btn"
            id="darkModeBtn"
            aria-label="Toggle dark mode"
          >
            🌙
          </button>
        </div>
      </div>
    </header>

    <main>
      <section>
        <div class="container">
          <div class="note-container">
            <p id="liveDate" class="live-date"></p>
            <p id="liveTime" class="live-time"></p>
            <h1 class="title">Latihan Dasar</h1>
            <form class="form" action="">
              <div class="input-wrapper">
                <input
                  type="text"
                  id="noteInput"
                  class="note-input"
                  placeholder="Tulis Catatan Anda..."
                  maxlength="100"
                />
                <button class="btn btn-primary" id="noteBtn">Tambah</button>
              </div>
              <p id="characterCounter" class="character-counter">0/100</p>
            </form>
            <div>
              <div class="search-wrapper">
                <input
                  type="text"
                  id="searchInput"
                  class="search-input"
                  placeholder="Cari Catatan..."
                  maxlength="50"
                />
                  <select class="sort-select" id="sortSelect">
                    <option value="newest" selected>Terbaru</option>
                    <option value="oldest">Terlama</option>
                    <option value="az">A-Z</option>
                    <option value="za">Z-A</option>
                  </select>
              </div>
              <div class="stats">
                <span id="totalNotes"></span>
                <span id="remainingNotes"></span>
                <span id="completedNotes"></span>
              </div>
              <h2 class="note-empty" id="noteEmpty"></h2>
              <ul class="note-list" id="noteList"></ul>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
