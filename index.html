<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Dasar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <div class="header-inner">
          <span class="logo">SalsNote</span>
          <button
            class="dark-mode-btn"
            id="darkModeBtn"
            aria-label="Toggle dark mode"
          >
            🌙
          </button>
        </div>
      </div>
    </header>

    <main>
      <section>
        <div class="container">
          <div class="note-container">
            <h1 class="title">Latihan Dasar</h1>
            <form class="form" action="">
              <input
                type="text"
                id="noteInput"
                class="note-input"
                placeholder="Tulis Catatan Anda..."
              />
              <button class="btn" id="noteBtn">Tambah</button>
            </form>
            <div>
              <div class="stats">
                <span id="totalNotes"></span>
                <span id="remainingNotes"></span>
                <span id="completedNotes"></span>
              </div>
              <h2 class="note-title" id="noteTitle"></h2>
              <ul class="note-list" id="noteList"></ul>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
